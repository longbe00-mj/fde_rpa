[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localrpa"
version = "0.1.0"
description = "Windows 로컬 RPA 실행기 (웹 + Windows 앱, 사용자 보조 → 무인화)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 2단계 이후에 사용. 1단계 엔진/테스트는 표준 라이브러리만 사용한다.
desktop = ["pyautogui", "pywinauto", "opencv-python", "pillow"]
web = ["playwright"]
agent = ["anthropic"]
dev = ["pytest"]

[project.scripts]
localrpa = "rpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = [
    "windows: Windows API를 읽기 전용으로 호출하는 테스트 (GUI 입력 없음)",
]
